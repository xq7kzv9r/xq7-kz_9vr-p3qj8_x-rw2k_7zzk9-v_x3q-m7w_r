<style>
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-text-size-adjust:100%}

/* ---------- 해킹 화면 (검은 배경 + 초록 코드) ---------- */
#screen{position:fixed;inset:0;overflow:hidden;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left))}
#code{margin:0;color:#00ff00;font:700 14px/1.22 "Courier New",Courier,ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  white-space:pre-wrap;word-break:break-all;text-shadow:0 0 3px rgba(0,255,0,.55)}
#cursor{display:inline-block;width:.6em;height:1.05em;vertical-align:-.15em;background:#00ff00;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* 폰: 가장 긴 줄(51자)이 화면 폭에 들어가도록 글자 크기를 폭에 맞춰 줄임 */
@media (max-width:600px){#code{font-size:clamp(8.5px,calc((100vw - 26px) / 32),11px)}}

#granted{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;z-index:5;
  padding:18px 34px;background:#002400;border:3px solid #00ff00;color:#00ff00;white-space:nowrap;
  font:700 clamp(24px,7vw,54px)/1.1 "Courier New",Courier,ui-monospace,monospace;letter-spacing:3px;
  text-shadow:0 0 8px #00ff00;box-shadow:0 0 40px rgba(0,255,0,.45)}
#granted.show{display:block;animation:blink .3s steps(1) infinite}

/* ---------- 사진 도배 ---------- */
#spam{position:fixed;inset:0;display:none;overflow:hidden;background:#000;z-index:10}
#spam canvas{position:absolute}
#base,#live{left:0;top:0;width:100%;height:100%}
#tile{opacity:0;transition:opacity 1s;animation:slide 3.5s linear infinite}
#spam.tile #tile{opacity:1}
@keyframes slide{from{transform:translate(0,0)}to{transform:translate(var(--tw),var(--th))}}
#spam.bump{animation:bump .25s}
@keyframes bump{0%{transform:scale(1.06)}100%{transform:scale(1)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
</style>

/* ---------- 사진 불러오기 ----------
   1순위: createImageBitmap — 이미지 '주소'를 거치지 않고 바이트를 바로 해석해서,
          보안 설정이 빡빡한 미리보기 화면에서도 막히지 않음
   2순위: data: 주소로 <img> 로드
   둘 다 실패하면: 사진 대신 "칼국수가 뭐지..?" 글자 카드로 도배 */
let meme = null;
function viaBitmap() {
  const bin = atob(MEME_B64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return createImageBitmap(new Blob([u], { type: 'image/jpeg' }));
}
function viaImg() {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('img load failed'));
    im.src = 'data:image/jpeg;base64,' + MEME_B64;
  });
}
const memeReady = (window.createImageBitmap ? viaBitmap().catch(viaImg) : viaImg())
  .then(m => (meme = m))
  .catch(() => null);

const CODE = `#include <linux/module.h>
#include <linux/slab.h>
#include <linux/spinlock.h>

#define RING_SLOTS      256
#define NODE_MAGIC      0x7f3a9c21

struct ring_node {
   u32 magic;
   u32 seq;
   u16 len;
   u8 flags;
   u8 data[48];
};

struct ring_buf {
   spinlock_t lock;
   unsigned int head;
   unsigned int tail;
   struct ring_node *slots[RING_SLOTS];
};

static struct ring_buf *rb;
static atomic_t node_count = ATOMIC_INIT(0);

static struct ring_node *node_alloc(u32 seq,
                                    u16 len)
{
   struct ring_node *n;

   if (len > sizeof(n->data))
      return ERR_PTR(-EMSGSIZE);
   n = kzalloc(sizeof(*n), GFP_ATOMIC);
   if (!n)
      return ERR_PTR(-ENOMEM);
   n->magic = NODE_MAGIC;
   n->seq = seq;
   n->len = len;
   atomic_inc(&node_count);
   return n;
}

static int ring_push(struct ring_buf *r,
                     struct ring_node *n)
{
   unsigned long flags;
   unsigned int next;

   spin_lock_irqsave(&r->lock, flags);
   next = (r->head + 1) % RING_SLOTS;
   if (next == r->tail) {
      spin_unlock_irqrestore(&r->lock, flags);
      return -ENOSPC;
   }
   r->slots[r->head] = n;
   r->head = next;
   spin_unlock_irqrestore(&r->lock, flags);
   return 0;
}

static u32 fold_checksum(const u8 *buf, size_t len)
{
   u32 sum = 0;
   size_t i;

   for (i = 0; i + 1 < len; i += 2)
      sum += (buf[i] << 8) | buf[i + 1];
   if (len & 1)
      sum += buf[len - 1] << 8;
   while (sum >> 16)
      sum = (sum & 0xffff) + (sum >> 16);
   return ~sum & 0xffff;
}

static void dump_node(const struct ring_node *n)
{
   char line[80];
   int off;

   for (off = 0; off < n->len; off += 16) {
      hex_dump_to_buffer(n->data + off,
            min(16, n->len - off), 16, 1,
            line, sizeof(line), true);
      pr_info("%04x: %s\\n", off, line);
   }
}

static int __init ring_init(void)
{
   rb = kzalloc(sizeof(*rb), GFP_KERNEL);
   if (!rb)
      return -ENOMEM;
   spin_lock_init(&rb->lock);
   pr_info("ring: %d slots ready\\n", RING_SLOTS);
   return 0;
}

static void __exit ring_exit(void)
{
   unsigned int i;

   for (i = rb->tail; i != rb->head;
        i = (i + 1) % RING_SLOTS)
      kfree(rb->slots[i]);
   kfree(rb);
   pr_info("ring: freed %d nodes\\n",
      atomic_read(&node_count));
}

module_init(ring_init);
module_exit(ring_exit);
MODULE_LICENSE("GPL");

`;

const screenEl = $('#screen'), codeEl = $('#code'), cursor = $('#cursor'), granted = $('#granted');
const txt = document.createTextNode('');
codeEl.insertBefore(txt, cursor);
let pos = 0;
function typeChars(n) {
  if (n <= 0) return;
  let s = '';
  for (let i = 0; i < n; i++) { s += CODE[pos]; pos = (pos + 1) % CODE.length; }
  txt.appendData(s);
  if (txt.length > 12000) {                       // 너무 길어지면 앞부분 정리
    const cut = txt.data.indexOf('\n', txt.length - 8000);
    if (cut > 0) txt.deleteData(0, cut + 1);
  }
  screenEl.scrollTop = screenEl.scrollHeight;     // 항상 맨 아래(방금 친 줄)가 보이게
}

/* ---------- 소리 (브라우저 정책상 화면을 한 번 터치/클릭해야 켜짐) ---------- */
let ac = null, fsTried = false;
function unlock() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  if (!fsTried) {
    fsTried = true;
    const de = document.documentElement, rq = de.requestFullscreen || de.webkitRequestFullscreen;
    try { const p = rq && rq.call(de); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
}
function beep(f, d = .05, type = 'square', v = .03, to) {
  if (!ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .03);
  } catch (e) {}
}

/* ---------- 해킹 타임라인 ---------- */
let t0 = null, last = 0, typeAcc = 0, lastClick = 0, phase = 'hack';
function hackFrame(now) {
  if (phase !== 'hack') return;
  if (t0 === null) { t0 = last = now; }
  const el = now - t0, dt = Math.min(.1, (now - last) / 1000);
  last = now;
  // 초당 약 230~430자, 살짝 들쭉날쭉하게 (사람이 빠르게 치는 느낌)
  const speed = 330 + Math.sin(el / 230) * 70 + Math.sin(el / 97) * 30;
  typeAcc += speed * dt;
  const n = Math.floor(typeAcc);
  typeAcc -= n;
  typeChars(n);
  if (n && now - lastClick > 45) { beep(rnd(1800, 2600), .012, 'square', .012); lastClick = now; }
  if (el >= GRANT_MS && !granted.classList.contains('show')) {
    granted.classList.add('show');
    [880, 1175, 1568].forEach((f, i) => setTimeout(() => beep(f, .12, 'square', .04), i * 110));
  }
  if (el >= HACK_MS) { startSpam(); return; }
  requestAnimationFrame(hackFrame);
}

/* ---------- 사진 도배 ----------
   사진을 요소 수백 개로 만들면 폰이 버벅이므로 캔버스에 그림:
   tile = 뒤에서 흘러가는 바둑판 배경, base = 다 튀어나온 사진을 계속 쌓는 판, live = 지금 튀어나오는 중인 사진 */
const spamEl = $('#spam');
const tileCv = document.createElement('canvas'), base = document.createElement('canvas'), live = document.createElement('canvas');
tileCv.id = 'tile'; base.id = 'base'; live.id = 'live';
let bctx = null, lctx = null;
let spamT0 = 0, spamLast = 0, spawnAcc = 0, lastPop = 0, spawned = 0, nextBig = 30;
const popping = [];

function drawMeme(ctx, x, y, w, h) {
  if (meme) { ctx.drawImage(meme, x, y, w, h); return; }
  // 사진을 끝내 못 불러왔을 때 대체 카드
  ctx.fillStyle = '#ffe9b0'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 ' + Math.round(h * .2) + 'px sans-serif';
  ctx.fillText('칼국수가 뭐지..?', x + w / 2, y + h / 2, w * .9);
}

function sizeSpam() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  if (base.width !== W || base.height !== H) {
    let old = null;
    if (base.width) { old = document.createElement('canvas'); old.width = base.width; old.height = base.height; old.getContext('2d').drawImage(base, 0, 0); }
    base.width = live.width = W; base.height = live.height = H;
    bctx = base.getContext('2d'); lctx = live.getContext('2d');
    if (old) bctx.drawImage(old, 0, 0, W, H);   // 화면 크기 바뀌어도 쌓인 사진 유지
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0); lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  // 흘러가는 배경 타일
  const tw = innerWidth < 600 ? 130 : 200, th = tw * MEME_H / MEME_W;
  const TW = innerWidth + tw * 2, TH = innerHeight + th * 2;
  tileCv.width = Math.round(TW * dpr); tileCv.height = Math.round(TH * dpr);
  tileCv.style.width = TW + 'px'; tileCv.style.height = TH + 'px';
  tileCv.style.left = -tw + 'px'; tileCv.style.top = -th + 'px';
  spamEl.style.setProperty('--tw', tw + 'px'); spamEl.style.setProperty('--th', th.toFixed(3) + 'px');
  const tc = tileCv.getContext('2d');
  tc.setTransform(dpr, 0, 0, dpr, 0, 0);
  try { for (let y = 0; y < TH; y += th) for (let x = 0; x < TW; x += tw) drawMeme(tc, x, y, tw, th); } catch (e) {}
}

const easeOutBack = x => { const c1 = 2.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function drawSprite(ctx, s, k) {
  const w = s.w, h = s.h, b = Math.max(3, w * .013);
  ctx.save();
  try {
    ctx.translate(s.x, s.y); ctx.rotate(s.r); ctx.scale(k, k);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-w / 2 - b + 7, -h / 2 - b + 9, w + 2 * b, h + 2 * b);
    ctx.fillStyle = '#fff'; ctx.fillRect(-w / 2 - b, -h / 2 - b, w + 2 * b, h + 2 * b);
    drawMeme(ctx, -w / 2, -h / 2, w, h);
  } catch (e) {}
  ctx.restore();
}

function spawn(x, y, big) {
  const baseW = Math.min(innerWidth, 1100);
  const w = big ? Math.min(innerWidth * .92, 1000) : baseW * rnd(.24, .62);
  popping.push({
    x: x != null ? x : rnd(0, innerWidth), y: y != null ? y : rnd(0, innerHeight),
    w, h: w * MEME_H / MEME_W, r: (big ? rnd(-6, 6) : rnd(-28, 28)) * Math.PI / 180,
    t0: performance.now(), big: !!big
  });
  spawned++;
  const now = performance.now();
  if (now - lastPop > 70) { const f = rnd(260, 620); beep(f, .14, 'sine', .07, f * rnd(1.8, 2.6)); lastPop = now; }
}

function spamFrame(now) {
  try {
    const el = (now - spamT0) / 1000, dt = Math.min(.1, (now - spamLast) / 1000);
    spamLast = now;
    const rate = Math.min(3 + el * el * 5, 45);   // 초당 생성 개수: 3개 → 최대 45개
    spawnAcc += rate * dt;
    while (spawnAcc >= 1) { spawn(); spawnAcc--; }
    if (spawned >= nextBig) { spawn(innerWidth / 2 + rnd(-60, 60), innerHeight / 2 + rnd(-40, 40), true); nextBig = spawned + ri(25, 45); }

    lctx.clearRect(0, 0, innerWidth, innerHeight);
    let i = 0;
    while (i < popping.length) {
      const s = popping[i], x = (now - s.t0) / POP_MS;
      if (x >= 1) {
        drawSprite(bctx, s, 1);                   // 다 튀어나온 사진은 바닥 판에 영구히 찍음
        popping.splice(i, 1);
        if (s.big) { spamEl.classList.remove('bump'); void spamEl.offsetWidth; spamEl.classList.add('bump'); }
      } else { drawSprite(lctx, s, Math.max(0, easeOutBack(x))); i++; }
    }
  } catch (e) {}
  requestAnimationFrame(spamFrame);               // 무슨 일이 있어도 루프는 계속
}

async function startSpam() {
  if (phase !== 'hack') return;
  phase = 'spam';
  if (!meme) await Promise.race([memeReady, new Promise(r => setTimeout(r, 1500))]);
  screenEl.remove(); granted.remove();
  spamEl.style.display = 'block';
  spamEl.append(tileCv, base, live);
  sizeSpam();
  addEventListener('resize', sizeSpam);
  $('#flash').classList.add('go');
  let tick = false;
  setInterval(() => { tick = !tick; document.title = tick ? '🍜 칼국수가 뭐지..?' : '칼국수가 뭐지..? 🍜'; }, 600);
  document.title = '칼국수가 뭐지..?';
  try {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    if (meme) g.drawImage(meme, 30, 0, 300, 300, 0, 0, 64, 64);
    $('#fav').href = c.toDataURL('image/png');
  } catch (e) {}
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .16, 'square', .05), i * 90));
  spawn(innerWidth / 2, innerHeight / 2, true);
  setTimeout(() => spamEl.classList.add('tile'), 1200);
  spamT0 = spamLast = performance.now();
  requestAnimationFrame(spamFrame);
}

/* ---------- 입력 ---------- */
addEventListener('pointerdown', e => {
  unlock();
  if (phase === 'hack') typeChars(12);
  else for (let i = 0; i < 6; i++) spawn(e.clientX + rnd(-50, 50), e.clientY + rnd(-50, 50));
}, { passive: true });
addEventListener('keydown', () => {
  unlock();
  if (phase === 'hack') typeChars(4); else spawn();
});

requestAnimationFrame(hackFrame);
})();
</script>
